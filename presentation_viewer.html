<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>AI Agent 與全端系統開發專案實績</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
    body {
      background-color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    /* 投影片主畫布 (16:9) */
    .viewer-container {
      width: 1066px;
      height: 600px;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      position: relative;
    }

    /* 左側側邊深色欄 */
    .sidebar {
      width: 280px;
      height: 100%;
      background-color: #1e293b;
      color: white;
      padding: 35px 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .main-title {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 1px;
    }
    .sub-title {
      font-size: 19px;
      color: #94a3b8;
      margin-top: 6px;
    }
    .center-icon {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 15px 0;
    }
    .circle-badge {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background-color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
    }
    .highlight-quote {
      color: #f59e0b;
      font-size: 16px;
      font-weight: bold;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .quote-desc {
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.4;
    }

    /* 右側主內容區 */
    .content-area {
      flex: 1;
      padding: 30px 35px;
      display: flex;
      gap: 20px;
      background-color: #f8fafc;
    }
    .steps-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .step-card {
      background-color: #edf5ff;
      border: 1.5px dashed #60a5fa;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 17px;
      font-weight: bold;
      color: #1e3a8a;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 48px;
    }
    .step-card span.highlight {
      color: #0284c7;
      font-weight: 900;
      text-decoration: underline;
      text-underline-offset: 4px;
      margin: 0 4px;
    }

    /* 右側分組分類標籤 */
    .groups-column {
      width: 100px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      border-left: 3px solid #3b82f6;
      padding-left: 14px;
    }
    .group-tag {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.3;
    }

    /* 下方播放控制列 */
    .controls-bar {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 20px;
      background-color: #1e293b;
      padding: 10px 24px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .btn {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn:hover {
      background-color: #2563eb;
      transform: scale(1.03);
    }
    .btn:disabled {
      background-color: #475569;
      cursor: not-allowed;
      transform: none;
    }
    .page-indicator {
      color: #e2e8f0;
      font-size: 15px;
      font-weight: bold;
      min-width: 60px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 簡報播放主畫布 -->
  <div class="viewer-container" id="slideCanvas">
    <!-- JS 會在此動態注入目前投影片 -->
  </div>

  <!-- 下方控制列 -->
  <div class="controls-bar">
    <button class="btn" id="prevBtn" onclick="prevSlide()">◀ 上一頁</button>
    <div class="page-indicator" id="pageNumber">1 / 1</div>
    <button class="btn" id="nextBtn" onclick="nextSlide()">下一頁 ▶</button>
  </div>

  <script>
    const data = {"presentation_title": "AI Agent 與全端系統開發專案實績", "slides": [{"main_title": "AI Agent 應用開發", "sub_title": "智慧簡報生成工作流系統", "icon_emoji": "📊", "quote_highlight": "端到端 Agentic 工作流落地", "quote_desc": "透過自動化流程解決傳統簡報製作耗時繁瑣的痛點，實現一鍵產出。", "steps": [{"text": "多格式數據解析與提取", "highlight_keyword": "多格式"}, {"text": "需求規格與語意架構對齊", "highlight_keyword": "語意架構"}, {"text": "文字預檢與自適應分頁審核", "highlight_keyword": "審核點"}, {"text": "簡報視覺渲染與產出", "highlight_keyword": "視覺產出"}], "groups": [{"label": "工作流設計", "step_count": 4}]}, {"main_title": "AI Agent 應用開發", "sub_title": "異常事件查詢流程簡化", "icon_emoji": "🔍", "quote_highlight": "自動化檢索與跨單位通報", "quote_desc": "結合 LLM Agent 與自然語言解析，將繁瑣的手動查詢化繁為簡。", "steps": [{"text": "異常事件基礎資訊輸入", "highlight_keyword": "基礎資訊"}, {"text": "自然語言解析與自動查詢", "highlight_keyword": "自動查詢"}, {"text": "異常歸因分析與判斷", "highlight_keyword": "歸因"}, {"text": "跨單位自動化通報", "highlight_keyword": "通報"}], "groups": [{"label": "流程自動化", "step_count": 4}]}, {"main_title": "全端系統開發", "sub_title": "曝光機參數批次修改系統", "icon_emoji": "⚙️", "quote_highlight": "高可用容錯與災難復原機制", "quote_desc": "確保高敏感性設備參數異動具備 100% 可逆性與系統可用性。", "steps": [{"text": "變更前自動鏡像備份", "highlight_keyword": "鏡像備份"}, {"text": "動態數值邊界防呆校驗", "highlight_keyword": "防呆"}, {"text": "批次寫入與執行", "highlight_keyword": "批次寫入"}, {"text": "異常回滾與軌跡追蹤", "highlight_keyword": "回滾"}], "groups": [{"label": "系統安全與維護", "step_count": 4}]}]};
    let currentIndex = 0;

    function renderSlide(index) {
      const slide = data.slides[index];
      const canvas = document.getElementById('slideCanvas');
      
      // 處理右側卡片文字 highlight
      const stepsHtml = slide.steps.map(step => {
        let content = step.text;
        if (step.highlight_keyword && content.includes(step.highlight_keyword)) {
          content = content.replace(
            step.highlight_keyword, 
            `<span class="highlight">${step.highlight_keyword}</span>`
          );
        }
        return `<div class="step-card">${content}</div>`;
      }).join('');

      // 處理右側分組垂直標籤
      const groupsHtml = slide.groups.map(g => {
        const formattedLabel = g.label.split('').join('<br>');
        return `<div class="group-tag">${formattedLabel}</div>`;
      }).join('');

      canvas.innerHTML = `
        <div class="sidebar">
          <div>
            <div class="main-title">${slide.main_title}</div>
            <div class="sub-title">${slide.sub_title}</div>
          </div>
          <div class="center-icon">
            <div class="circle-badge">${slide.icon_emoji || '💡'}</div>
          </div>
          <div>
            <div class="highlight-quote">${slide.quote_highlight}</div>
            <div class="quote-desc">${slide.quote_desc}</div>
          </div>
        </div>

        <div class="content-area">
          <div class="steps-column">${stepsHtml}</div>
          <div class="groups-column">${groupsHtml}</div>
        </div>
      `;

      // 更新控制列狀態
      document.getElementById('pageNumber').innerText = `${index + 1} / ${data.slides.length}`;
      document.getElementById('prevBtn').disabled = (index === 0);
      document.getElementById('nextBtn').disabled = (index === data.slides.length - 1);
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide(currentIndex);
      }
    }

    function nextSlide() {
      if (currentIndex < data.slides.length - 1) {
        currentIndex++;
        renderSlide(currentIndex);
      }
    }

    // 支援鍵盤左右方向鍵切換
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'ArrowRight') nextSlide();
    });

    // 初始化渲染第一頁
    renderSlide(0);
  </script>
</body>
</html>
