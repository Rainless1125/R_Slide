services:
  rslide:
    build: .
    image: rslide
    container_name: rslide
    ports:
      - "8000:8000"
    # API Key 等設定從 .env 讀取（先複製 .env_example 為 .env 再填寫）
    env_file: .env
    environment:
      RSLIDE_DB_PATH: /app/data/rslide.db
    volumes:
      # 帳號與歷史記錄存在 named volume，重建容器也不會遺失
      - rslide-data:/app/data
      # 企業 / 品牌識別圖示：直接修改主機上的 brand_icon 資料夾，不需重建映像檔
      - ./brand_icon:/app/brand_icon:ro
    restart: unless-stopped

volumes:
  rslide-data:
