<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Slide Agent - 自適應多版面生成器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- 頂部導航 -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🎨</span>
        <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">AI Adaptive Slide Agent</span>
        <span class="text-xs bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded-full border border-purple-500/30">自適應多版面模式</span>
      </div>
      <div class="text-xs text-slate-400">Gemini 動態佈局生成引擎</div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-8">

    <!-- 步驟條 -->
    <div class="flex items-center justify-center mb-8 text-sm font-semibold">
      <div id="stepTag1" class="flex items-center gap-2 text-blue-400">
        <span class="w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs">1</span>
        素材與版面意圖輸入
      </div>
      <div class="w-12 h-[2px] bg-slate-800 mx-2"></div>
      <div id="stepTag2" class="flex items-center gap-2 text-slate-500">
        <span class="w-7 h-7 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center text-xs">2</span>
        AI 版面構思審查
      </div>
      <div class="w-12 h-[2px] bg-slate-800 mx-2"></div>
      <div id="stepTag3" class="flex items-center gap-2 text-slate-500">
        <span class="w-7 h-7 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center text-xs">3</span>
        動態播放器
      </div>
    </div>

    <!-- 步驟 1: 輸入區 -->
    <section id="sectionInput" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
      <h2 class="text-lg font-bold text-white mb-2 flex items-center gap-2">
        <span>📄</span> 提供內容（AI 會依據內容類型自動切換合適排版）
      </h2>
      <p class="text-xs text-slate-400 mb-4">輸入包含成效、流程或技術對比的素材，AI 會針對不同頁面分別設計 KPI 卡片、流程圖或對照欄位。</p>

      <div class="space-y-4">
        <textarea id="inputContent" rows="7" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition" placeholder="請貼上內容..."></textarea>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">目標簡報對象：</label>
            <input type="text" id="targetAudience" value="高階主管 / 產線技術長" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">簡報頁數：</label>
            <select id="numPages" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200">
              <option value="2">2 頁精簡版</option>
              <option value="3" selected>3 頁完整版</option>
              <option value="4">4 頁深度版</option>
            </select>
          </div>
        </div>

        <div class="flex justify-end pt-2">
          <button id="btnGenerate" onclick="startGeneration()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-2.5 rounded-xl shadow-lg shadow-blue-600/30 flex items-center gap-2 transition active:scale-95">
            <span>啟動自適應排版生成</span>
            <span id="loadingSpinner" class="hidden animate-spin">⚪</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 步驟 2: AI 版面構思審查 (對齊最新資料結構) -->
    <section id="sectionReview" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl mt-6">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <span>📐</span> 第二步：AI 自適應版面構思審查
          </h2>
          <p class="text-xs text-slate-400">AI 已根據各頁內容特徵，分配了最適的視覺組件與排版理念，您可以直接點擊進入預覽。</p>
        </div>
        <button onclick="confirmAndPlay()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-5 py-2 rounded-xl shadow-lg transition active:scale-95">
          確認版面，立即預覽 ▶
        </button>
      </div>

      <div id="reviewContainer" class="space-y-3">
        <!-- JS 動態插入 -->
      </div>
    </section>

    <!-- 步驟 3: 動態播放器畫布 -->
    <section id="sectionPlayer" class="hidden mt-6 flex flex-col items-center">
      <div class="w-full flex items-center justify-between mb-3">
        <div>
          <h2 id="presentationTitleDisplay" class="text-xl font-black text-white"></h2>
          <span id="currentLayoutBadge" class="text-xs bg-slate-800 text-blue-400 px-2.5 py-1 rounded border border-slate-700 mt-1 inline-block"></span>
        </div>
        <button onclick="backToReview()" class="text-xs text-slate-400 hover:text-white underline">
          ✏️ 返回版面列表
        </button>
      </div>

      <!-- 16:9 投影片主畫布 (等比 960x540) -->
      <div id="slideCanvas" class="w-full max-w-[960px] h-[540px] rounded-xl overflow-hidden shadow-2xl border border-slate-800 relative bg-white">
        <!-- AI 自由生成的 HTML 將直接注入此處 -->
      </div>

      <!-- 下方控制器 -->
      <div class="mt-4 flex items-center gap-4 bg-slate-900 border border-slate-800 px-5 py-2.5 rounded-full shadow-lg">
        <button id="prevBtn" onclick="prevSlide()" class="bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 disabled:text-slate-600 text-white px-4 py-1.5 rounded-full text-xs font-bold transition">◀ 上一頁</button>
        <span id="pageIndicator" class="text-sm font-bold text-slate-200 min-w-[60px] text-center">1 / 1</span>
        <button id="nextBtn" onclick="nextSlide()" class="bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 disabled:text-slate-600 text-white px-4 py-1.5 rounded-full text-xs font-bold transition">下一頁 ▶</button>
      </div>
    </section>

  </main>

  <script>
    let currentPresentationData = null;
    let currentSlideIdx = 0;

    // 測試素材：涵蓋三種完全不同的內容性質（痛點背景、解決方案流程、量化成效KPI）
    document.getElementById('inputContent').value = `曝光機生產參數批次修改網頁系統

第一頁：現狀痛點與高額風險。
曝光機是高科技半導體/面板產線最昂貴的核心設備。過去修改 XML 參數皆為現場手動調整，流程繁雜且容易出錯。一旦參數誤植將導致整批產品直接報廢，帶來百萬級嚴重虧損。

第二頁：跨世代架構解決方案與安全機制。
分別針對舊機型 (C#/.NET) 與新機型 (PHP/Python) 開發全端網頁批次修改系統。
核心防護包含三道防線：1. 變更前自動鏡像備份、2. 邊界數值計算防呆、3. 異常發生秒級回滾 (Rollback)。

第三頁：專案成果與量化效益。
1. 換線調整工時縮短 85%（由 2 小時縮短至 18 分鐘）。
2. 人為誤操作報廢率降為 0%。
3. 達到 100% 變更稽核軌跡追蹤 (Audit Log)。`;

    async function startGeneration() {
      const content = document.getElementById('inputContent').value.trim();
      const targetAudience = document.getElementById('targetAudience').value;
      const numPages = parseInt(document.getElementById('numPages').value);

      if (!content) return alert("請輸入內容！");

      const btn = document.getElementById('btnGenerate');
      const spinner = document.getElementById('loadingSpinner');
      btn.disabled = true;
      spinner.classList.remove('hidden');

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content, target_audience: targetAudience, num_pages: numPages })
        });
        
        if (!res.ok) throw new Error(await res.text());
        currentPresentationData = await res.json();
        renderReviewSection();
      } catch (err) {
        alert("生成失敗: " + err.message);
      } finally {
        btn.disabled = false;
        spinner.classList.add('hidden');
      }
    }

    // 關鍵修復：正確讀取新版 slide_title 與 layout_concept 欄位
    function renderReviewSection() {
      document.getElementById('sectionReview').classList.remove('hidden');
      document.getElementById('sectionPlayer').classList.add('hidden');
      document.getElementById('stepTag2').className = "flex items-center gap-2 text-emerald-400 font-bold";

      const container = document.getElementById('reviewContainer');
      container.innerHTML = '';

      currentPresentationData.slides.forEach((slide, idx) => {
        const card = document.createElement('div');
        card.className = "p-4 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between";
        card.innerHTML = `
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded font-bold">第 ${slide.page_number} 頁</span>
              <span class="text-sm font-bold text-white">${slide.slide_title}</span>
            </div>
            <div class="text-xs text-purple-300 mt-1">✨ AI 推薦版面概念：${slide.layout_concept}</div>
          </div>
          <button onclick="previewSingleSlide(${idx})" class="text-xs text-blue-400 hover:text-blue-300 underline font-semibold">直接預覽此頁 ▶</button>
        `;
        container.appendChild(card);
      });

      document.getElementById('sectionReview').scrollIntoView({ behavior: 'smooth' });
    }

    function previewSingleSlide(idx) {
      confirmAndPlay();
      currentSlideIdx = idx;
      renderSlide(idx);
    }

    function confirmAndPlay() {
      document.getElementById('sectionPlayer').classList.remove('hidden');
      document.getElementById('sectionReview').classList.add('hidden');
      document.getElementById('stepTag3').className = "flex items-center gap-2 text-indigo-400 font-bold";

      document.getElementById('presentationTitleDisplay').innerText = currentPresentationData.presentation_title;
      currentSlideIdx = 0;
      renderSlide(0);
      document.getElementById('sectionPlayer').scrollIntoView({ behavior: 'smooth' });
    }

    function backToReview() {
      document.getElementById('sectionReview').classList.remove('hidden');
      document.getElementById('sectionPlayer').classList.add('hidden');
    }

    function renderSlide(index) {
      const slide = currentPresentationData.slides[index];
      const canvas = document.getElementById('slideCanvas');
      
      // 直接將 AI 依據該頁內容自由設計的 Tailwind HTML 注入畫布
      canvas.innerHTML = slide.html_content;

      // 更新版型標籤與分頁資訊
      document.getElementById('currentLayoutBadge').innerText = `目前版型：${slide.layout_concept}`;
      document.getElementById('pageIndicator').innerText = `${index + 1} / ${currentPresentationData.slides.length}`;
      document.getElementById('prevBtn').disabled = (index === 0);
      document.getElementById('nextBtn').disabled = (index === currentPresentationData.slides.length - 1);
    }

    function prevSlide() {
      if (currentSlideIdx > 0) {
        currentSlideIdx--;
        renderSlide(currentSlideIdx);
      }
    }

    function nextSlide() {
      if (currentSlideIdx < currentPresentationData.slides.length - 1) {
        currentSlideIdx++;
        renderSlide(currentSlideIdx);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (document.getElementById('sectionPlayer').classList.contains('hidden')) return;
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'ArrowRight') nextSlide();
    });
  </script>
</body>
</html>
